name: Portable distribution
on:
  push:
  pull_request:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - name: Portable contracts (no personal installation or model calls)
        run: uv run --no-project --python 3.11 python -B -m unittest discover -s tests -p test_intelliforge.py -v
      - run: uv build
      - name: Inspect packaged resources in an isolated tool environment
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv tool run --from $wheel intelliforge inspect --agent claude --only yomiyasu --json
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.11 --with "PyYAML>=6,<7" python -B -m unittest discover -s tests -v
      - run: python3 tools/codex-yomiyasu/build_installer.py --check
      - run: bash -n install_all.sh && bash -n install_codex_yomiyasu.sh
