<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文書管理</title>
<style>
:root{color-scheme:light;--ink:#243632;--muted:#65736f;--line:#dce3de;--accent:#21644e;--canvas:#f6f7f3}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif;font-size:16px;line-height:1.6}button,input,textarea{font:inherit}button{cursor:pointer}button,input,textarea{outline-offset:4px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #408c71}button{color:inherit}header{height:80px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 max(32px,calc((100% - 1120px)/2));gap:12px;font-weight:700;font-size:19px}.brand-icon{display:grid;place-items:center;background:var(--accent);width:36px;height:36px;color:white;border-radius:9px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}main{max-width:1120px;margin:0 auto;padding:55px 32px 80px}h1{font-size:30px;line-height:1.4;letter-spacing:.035em;margin:0 0 30px;font-weight:700}h2{font-size:19px;margin:0 0 18px}.search-field{max-width:460px;margin-bottom:30px}.search-field label{font-size:14px;display:block;font-weight:600;margin-bottom:8px}.search-box{display:flex;align-items:center;gap:12px;padding:0 15px;background:white;border:1px solid #aebdb4;border-radius:7px}.search-box svg{color:var(--muted);width:20px}input{width:100%;min-width:0;border:0;background:transparent;padding:12px 0;color:var(--ink);font-size:16px}input:focus{outline:none}.search-box:focus-within{outline:3px solid #408c71;outline-offset:3px}input::placeholder,textarea::placeholder{color:#76817c}.document-list{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.table-head,.doc-row{display:grid;grid-template-columns:minmax(0,1fr) 140px 160px 104px;align-items:center;gap:18px;padding:0 26px}.table-head{min-height:49px;background:#edf1ec;font-size:13px;color:#596b61;font-weight:600}.doc-row{min-height:100px;border-top:1px solid var(--line)}.doc-name{display:flex;align-items:center;gap:16px;min-width:0;font-weight:650;font-size:17px}.file-icon{color:#6c7f71;width:40px;height:48px;background:#f1f4ef;border-radius:6px;display:grid;place-items:center;flex-shrink:0}.file-icon svg{width:23px;height:26px}.format{color:var(--muted);font-size:14px}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:5px;font-size:13px;line-height:1.5;padding:5px 10px;white-space:nowrap;width:fit-content}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.progress{background:#eaf0fc;color:#3f5f9c}.waiting{background:#fbf0d9;color:#89601a}.complete{background:#e9f3ec;color:#3d7251}.open-btn{border:1px solid #c6d5cc;border-radius:6px;background:white;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap}.open-btn svg{width:16px;height:16px}.open-btn:hover{background:#edf5ef;border-color:var(--accent);color:var(--accent)}.empty{padding:40px 24px;text-align:center;color:var(--muted)}[hidden]{display:none!important}.back{display:inline-flex;align-items:center;gap:8px;border:0;padding:0;background:transparent;color:var(--accent);font-weight:600;font-size:15px;margin-bottom:26px}.back svg{width:19px;height:19px}.detail-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px}.detail-heading{display:flex;align-items:center;gap:18px;margin-bottom:24px}.detail-heading .file-icon{width:48px;height:56px}.detail-heading h1{margin:0}.properties{display:flex;gap:54px;border-bottom:1px solid var(--line);padding-bottom:27px;margin:0 0 28px}.properties div{display:flex;align-items:center;gap:15px}.properties dt{color:var(--muted);font-size:14px}.properties dd{margin:0}.note-label{display:block;font-size:18px;font-weight:650;margin-bottom:12px}textarea{display:block;width:100%;min-height:210px;resize:vertical;border:1px solid #acbbb2;border-radius:6px;background:#fdfefc;color:var(--ink);padding:15px}.note-foot{display:flex;justify-content:flex-end;min-height:31px;margin-top:7px;font-size:12px;color:var(--muted)}.related-section{border-top:1px solid var(--line);margin-top:23px;padding-top:25px}.related-section h2{font-size:17px;margin-bottom:12px}.related-btn{display:flex;align-items:center;gap:12px;background:#f3f6f1;border:1px solid #d9e2d9;border-radius:6px;padding:13px 16px;min-width:240px;text-align:left;font-size:16px;font-weight:600}.related-btn svg:last-child{margin-left:auto;width:18px}.related-btn:hover{background:#e7f0e8}.none{color:var(--muted);margin:0;font-size:14px}
@media(max-width:600px){header{height:68px;padding:0 22px;font-size:17px}.brand-icon{height:32px;width:32px}main{padding:32px 20px 48px}h1{font-size:26px;margin-bottom:25px}.search-field{margin-bottom:24px;max-width:none}.table-head{display:none}.doc-row{position:relative;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:20px 16px;min-height:145px}.doc-row:first-of-type{border-top:0}.doc-name{grid-column:1;gap:12px;font-size:17px}.file-icon{width:34px;height:40px}.format{grid-column:1;padding-left:46px;grid-row:2;font-size:13px}.doc-row>.badge{grid-column:1;grid-row:3;margin-left:46px;margin-top:-5px}.open-btn{grid-column:2;grid-row:1 / 4;padding:9px 11px}.detail-card{padding:23px 19px}.detail-heading{gap:13px;margin-bottom:24px}.detail-heading h1{font-size:25px}.detail-heading .file-icon{width:39px;height:48px}.properties{gap:22px;justify-content:space-between;padding-bottom:23px;margin-bottom:24px}.properties div{gap:10px}.properties dt{font-size:13px}.properties dd{font-size:14px}.badge{font-size:12px}textarea{min-height:230px}.related-btn{width:100%;min-width:0}.back{margin-bottom:23px}}
</style>
</head>
<body>
<header><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v6h5M8 13h8M8 17h6"/></svg></span>文書管理</header>
<main>
<section id="list-view" aria-labelledby="list-title">
<h1 id="list-title">文書一覧</h1>
<div class="search-field"><label for="search">文書を検索</label><div class="search-box"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="文書名・形式・状態で検索" autocomplete="off"></div></div>
<div class="document-list"><div class="table-head" aria-hidden="true"><span>文書名</span><span>形式</span><span>状態</span><span></span></div><div id="rows"></div><p class="empty" id="empty" role="status" hidden>該当する文書がありません。</p></div>
</section>
<section id="detail-view" aria-labelledby="doc-title" hidden>
<button id="back" class="back" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h15"/></svg>一覧へ戻る</button>
<article class="detail-card"><div class="detail-heading"><span class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h6"/></svg></span><h1 id="doc-title" tabindex="-1"></h1></div>
<dl class="properties"><div><dt>形式</dt><dd id="doc-format"></dd></div><div><dt>状態</dt><dd id="doc-status"></dd></div></dl>
<label class="note-label" for="note">メモ</label><textarea id="note" placeholder="この文書についてのメモを入力"></textarea><div class="note-foot"><span id="save-status" role="status">入力内容は自動で保存されます</span></div>
<div class="related-section"><h2>関連文書</h2><button type="button" id="related" class="related-btn"></button><p id="no-related" class="none" hidden>関連文書はありません。</p></div>
</article></section>
</main>
<script>
'use strict';
const docs=[{id:'a',name:'設計仕様',format:'PDF',status:'進行中',tone:'progress',related:'b'},{id:'b',name:'契約書',format:'PDF',status:'確認待ち',tone:'waiting',related:'a'},{id:'c',name:'議事録',format:'テキスト',status:'完了',tone:'complete',related:null}];
const $=id=>document.getElementById(id);
const fileIcon='<span class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h6"/></svg></span>';
const arrow='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>';
let state={query:'',notes:{}};
try{const stored=JSON.parse(localStorage.getItem('document-manager-state'));if(stored&&typeof stored.query==='string'&&stored.notes&&typeof stored.notes==='object')state=stored;}catch(e){}
let active=null,lastOpened=null;
function persist(){try{localStorage.setItem('document-manager-state',JSON.stringify(state));return true;}catch(e){return false;}}
function badge(doc){return '<span class="badge '+doc.tone+'">'+doc.status+'</span>';}
function renderList(){const query=state.query.trim().toLocaleLowerCase();const filtered=docs.filter(doc=>[doc.name,doc.format,doc.status].some(value=>value.toLocaleLowerCase().includes(query)));$('rows').innerHTML=filtered.map(doc=>'<div class="doc-row"><div class="doc-name">'+fileIcon+'<span>'+doc.name+'</span></div><span class="format">'+doc.format+'</span>'+badge(doc)+'<button type="button" class="open-btn" data-open="'+doc.id+'" aria-label="'+doc.name+'の詳細を開く">詳細を開く'+arrow+'</button></div>').join('');$('empty').hidden=filtered.length>0;}
function openDoc(id){const doc=docs.find(item=>item.id===id);if(!doc)return;active=id;$('doc-title').textContent=doc.name;$('doc-format').textContent=doc.format;$('doc-status').innerHTML=badge(doc);$('note').value=typeof state.notes[id]==='string'?state.notes[id]:'';$('save-status').textContent='入力内容は自動で保存されます';const related=docs.find(item=>item.id===doc.related);$('related').hidden=!related;$('no-related').hidden=!!related;if(related)$('related').innerHTML=fileIcon+'<span>'+related.name+'</span>'+arrow;$('list-view').hidden=true;$('detail-view').hidden=false;$('doc-title').focus();window.scrollTo(0,0);}
$('search').value=state.query;
$('search').addEventListener('input',event=>{state.query=event.target.value;persist();renderList();});
$('rows').addEventListener('click',event=>{const button=event.target.closest('[data-open]');if(button){lastOpened=button.dataset.open;openDoc(lastOpened);}});
$('note').addEventListener('input',event=>{if(!active)return;state.notes[active]=event.target.value;const saved=persist();$('save-status').textContent=saved?'保存しました':'この画面内で保持しています';});
$('related').addEventListener('click',()=>{const doc=docs.find(item=>item.id===active);if(doc&&doc.related)openDoc(doc.related);});
$('back').addEventListener('click',()=>{$('detail-view').hidden=true;$('list-view').hidden=false;active=null;const button=document.querySelector('[data-open="'+lastOpened+'"]');if(button)button.focus();else $('search').focus();});
renderList();
</script>
</body>
</html>
